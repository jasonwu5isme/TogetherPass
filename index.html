<main><section class="hero wrap"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span><span data-en="A LOCAL INVITATION. A HUMAN WELCOME." data-zh="一次本地邀请，一份有人接应的安心。"></span></div><h1 data-en="A supported start.<br>A local <i>connection.</i>" data-zh="让参与社区，<br><i>从容开始。</i>"></h1><p class="lede" data-en="An institution funds access. A coordinator helps you join. A named host welcomes you. Explore a proposed service that supports the first visit and the choice to return." data-zh="机构资助参与，协调员协助报名，迎接人提供到场支持。Together Pass 希望让第一次加入本地活动更轻松，并支持居民自主选择继续参与。"></p><a class="button dark" href="#experience"><span data-en="Explore the interactive journey" data-zh="探索交互旅程"></span><span>↗</span></a><a class="hero-about" href="about.html" data-en="Discover the project <span>›</span>" data-zh="了解项目背景 <span>›</span>"></a><div class="hero-caption" data-en="UNIVERSITY OF SYDNEY · INDUSTRY COLLABORATION · GROUP PROJECT" data-zh="悉尼大学 Prezzee校企合作项目 · 团队概念原型"></div></div><div class="hero-art" aria-label="Illustration of a community invitation"><div class="orbit o1"></div><div class="orbit o2"></div><span class="art-note" data-en="Come as you are." data-zh="自在地来。"></span><div class="pass"><div class="pass-top">together pass <span>↗</span></div><div class="pass-symbol"><span></span><span></span><span></span></div><div class="pass-label" data-en="SUPPORTED COMMUNITY ACCESS" data-zh="有支持的社区参与"></div><h2 data-en="A place to begin." data-zh="从这里开始。"></h2><div class="pass-bottom"><span data-en="BLACKTOWN, WESTERN SYDNEY" data-zh="Blacktown（悉尼西部）"></span><span>CONCEPT / 01</span></div></div><div class="welcome-note"><span class="mini-people">☺</span><div><strong data-en="Someone to welcome you." data-zh="有人迎接你的到来。"></strong><small data-en="An invitation. A place. A welcome." data-zh="从邀请，到名额，再到迎接。"></small></div></div><span class="art-index">COMMUNITY / PARTICIPATION</span></div></section>
<div class="context-strip"><div class="wrap"><span data-en="PROPOSED PILOT" data-zh="拟议试点"></span><strong data-en="Up to 30 residents" data-zh="最多 30 名居民"></strong><strong data-en="6 weeks of participation" data-zh="6 周参与期"></strong><strong data-en="1 institutional buyer" data-zh="1 个机构买方"></strong><span data-en="Planning assumptions, not results." data-zh="规划假设，非实际成果。"></span></div></div>
<section class="wrap experience" id="experience"><div class="section-heading"><div><div class="eyebrow" data-en="01 / EXPERIENCE THE IDEA" data-zh="01 / 体验方案"></div><h2 data-en="Meet Sarah.<br>Take the first step." data-zh="认识 Sarah。<br>一起迈出第一步。"></h2></div><p data-en="An illustrative resident, a proposed service. Try the journey from invitation to a voluntary next visit. Nothing here submits a booking or processes a payment." data-zh="通过示例居民 Sarah，体验从邀请到自愿再次参与的拟议流程。这里的操作不会提交预约或进行支付。"></p></div><div class="demo-grid"><div class="journey-left"><div class="route-label" data-en="BEFORE THE INVITATION" data-zh="发出邀请之前"></div><p class="route-intro" data-en="The buyer and coordinator select a suitable, approved access route first." data-zh="机构买方与协调员先确定适合且获批的参与资助路径。"></p><div class="route-picker" role="group" aria-label="Illustrative access route"><button data-route="card"></button><button data-route="direct"></button><button data-route="member"></button></div><p class="route-warning" id="route-warning"></p><div id="steps" class="steps"></div></div><div class="phone-column"><div class="phone"><div class="phone-status"><span>9:41</span><span>••• ▰</span></div><div class="phone-nav"><button id="back" aria-label="Previous step">←</button><span>together pass</span><button id="reset" aria-label="Reset demo">↺</button></div><div id="phone-content" aria-live="polite"></div><div class="phone-home"></div></div><div class="simulation" data-en="SIMULATED INTERFACE · NO LIVE INTEGRATIONS" data-zh="模拟界面 · 未接入真实服务"></div></div><aside class="journey-aside"><div class="aside-number" id="step-number">01</div><h3 id="aside-title"></h3><p id="aside-description"></p><div class="handoff"><span data-en="WHO HELPS HERE" data-zh="此处由谁支持"></span><strong id="aside-owner"></strong></div><div class="quiet-note"><span>↗</span><p data-en="The innovation is the supported service: referrals, a named host and repeat opportunities. Whether a gift card adds value still needs testing." data-zh="创新重点是参与支持服务：转介、明确的迎接人及重复参与机会。礼品卡能否创造额外价值仍需验证。"></p></div></aside></div></section>
<section class="model-section" id="model"><div class="wrap"><div class="section-heading"><div><div class="eyebrow" data-en="02 / A SERVICE, SHARED RESPONSIBILITIES" data-zh="02 / 服务与职责"></div><h2 data-en="Support connects the pieces." data-zh="用支持串联每一步。"></h2></div><p data-en="The final proposal is B2B2C: an institution funds access, a community coordinator supports residents, and an activity provider hosts them. Partners and agreements remain proposed." data-zh="最终方案采用 B2B2C 模式：机构资助参与，社区协调员支持居民，活动提供方负责接待与活动。所有合作与协议均为拟议。"></p></div><div class="roles"><article><span class="role-icon">01 ↗</span><h3 data-en="Institutional buyer" data-zh="机构买方"></h3><p data-en="Approves funds, compares routes and purchases suitable access. RANSW is the proposed buyer, subject to agreement." data-zh="批准资金、比较路径并采购适合的参与方式。RANSW 是拟议买方，须达成协议。"></p></article><article><span class="role-icon">02 ↗</span><h3 data-en="Community coordinator" data-zh="社区协调员"></h3><p data-en="Manages invitations, registration help and opt-in follow-up. The proposal places this role at RANSW’s Blacktown Centre." data-zh="负责邀请、报名协助及自愿后续联系。方案拟由 RANSW 的 Blacktown（澳大利亚悉尼西部地区）中心承担。"></p></article><article><span class="role-icon">03 ↗</span><h3 data-en="Activity provider" data-zh="活动提供方"></h3><p data-en="Workers Lifestyle Group (WLG), a Western Sydney hospitality and leisure group, is the proposed provider: confirms places, handles bookings, names a host and records visits. Capacity needs confirmation." data-zh="拟由 WLG（Workers Lifestyle Group，悉尼西部的餐饮与休闲集团）确认名额、处理预约、安排迎接人并记录到场。交付能力需确认。"></p></article><article><span class="role-icon">04 ↗</span><h3 data-en="Card delivery, if useful" data-zh="有价值时采用卡片路径"></h3><p data-en="On an approved card route, Prezzee would deliver the selected product. Merchant acceptance and payment/refund tests come first." data-zh="在获批的卡片路径下，由 Prezzee 发放所选产品。商户接受能力、支付及退款测试必须先完成。"></p></article></div><div class="principle"><span>↳</span><p data-en="Keep the welcome. Choose the payment route that earns its place." data-zh="保留参与支持，让支付路径用价值证明自己。"></p></div></div></section>
<section class="wrap economics" id="economics"><div class="section-heading"><div><div class="eyebrow" data-en="03 / TEST THE VALUE" data-zh="03 / 验证价值"></div><h2 data-en="Does a card make<br>the difference?" data-zh="礼品卡能带来<br>额外价值吗？"></h2></div><p data-en="Compare equivalent access with the same welcome support. The proposal asks whether distribution, usable choice or administration benefits justify the card premium." data-zh="在相同迎接支持下比较等效参与机会。方案需要验证分发、可用选择或管理收益能否支撑卡片路径的额外成本。"></p></div><div class="cost-panel"><div class="cost-control"><span data-en="ILLUSTRATIVE COHORT" data-zh="示例批次"></span><h3><b id="count">30</b> <span data-en="residents" data-zh="名居民"></span></h3><input aria-label="Illustrative resident count" type="range" min="1" max="30" value="30" id="resident-count"><p data-en="The pilot reference case is 30 residents. This sensitivity tool changes access costs only; shared support stays at A$5,260. It does not re-cost staffing for a smaller pilot." data-zh="试点基准为 30 人。滑块仅调整入场成本，共同支持费用仍为 A$5,260，不代表已重新测算小规模试点的人员成本。"></p><div class="cost-key"><span data-en="Equal support in every route" data-zh="各路径保持相同支持"></span><strong>A$5,260</strong></div></div><div class="cost-bars" id="cost-bars"></div></div><p class="footnote" data-en="Membership assumes eligibility and included activities at A$6 per resident. Direct entry assumes three A$10 visits. Cards assume A$30 principal per resident plus a provisional A$500 service provision. All costs and acceptance require validation. Card principal is not Prezzee revenue." data-zh="会员路径假设每人 A$6、符合资格且所选活动包含在内；直接付费假设三次 A$10 到访；卡片路径假设每人 A$30 本金及暂列 A$500 服务费用。成本和支付适配均需验证。卡片本金不等于 Prezzee 收入。"></p></section>
<section class="roadmap-section"><div class="wrap"><div class="eyebrow" data-en="04 / VALIDATE BEFORE EXPANDING" data-zh="04 / 先验证，再扩展"></div><h2 data-en="A pilot is a question.<br>Not a promised outcome." data-zh="试点用于提问。<br>成果需要验证。"></h2><div class="roadmap"><article><span>01—06</span><small data-en="PREPARATION · MONTHS" data-zh="准备期 · 月"></small><h3 data-en="Make it workable" data-zh="确认可执行性"></h3><p data-en="Agree roles and funding, compare access routes, test payment and refunds, confirm capacity and consult residents." data-zh="明确职责与资金，比较资助路径，测试支付及退款，确认名额，并向居民咨询。"></p></article><article><span>06</span><small data-en="PILOT · WEEKS" data-zh="试点期 · 周"></small><h3 data-en="Observe participation" data-zh="观察真实参与"></h3><p data-en="After preparation, invite up to 30 residents. Record first and return visits, delivery reliability, feedback and full costs separately." data-zh="准备完成后邀请最多 30 名居民。分别记录首次与重复到访、交付可靠性、反馈及完整成本。"></p></article><article><span>04—06</span><small data-en="FOLLOW-UP · WEEKS AFTER SUPPORT" data-zh="支持结束后随访 · 周"></small><h3 data-en="See what continues" data-zh="了解参与能否持续"></h3><p data-en="Check continued attendance and affordability. Repeat orders and expansion depend on funding, buyer value and delivery capacity." data-zh="了解持续参与及可负担性。机构续购与扩展取决于资金、买方价值及交付能力。"></p></article></div></div></section>
<section class="project-teaser wrap"><div class="eyebrow" data-en="BEHIND THE CONCEPT" data-zh="方案背后"></div><h2 data-en="From a business question<br>to a service worth testing." data-zh="从商业问题，<br>走向可验证的服务方案。"></h2><p data-en="Explore the team’s research, design refinement, financial assumptions and Shijie Wu’s contribution." data-zh="了解团队研究、方案演变、商业测算，以及吴世杰在商业模式与可行性分析中的贡献。"></p><a class="button dark" href="about.html"><span data-en="About the project" data-zh="查看项目介绍"></span><span>↗</span></a></section>
