<main><section class="about-hero wrap"><div class="eyebrow" data-en="UNIVERSITY OF SYDNEY · PREEZY INDUSTRY COLLABORATION" data-zh="悉尼大学 Preezy校企合作项目"></div><h1 data-en="An invitation.<br>With support built in." data-zh="让一份邀请，<br>成为有支持的参与。"></h1><p data-en="Together Pass explores an institution-funded route into local activities, combining community referrals, activity information, welcome contacts and the choice to return." data-zh="Together Pass 探索机构资助的本地活动参与方式，将社区转介、活动信息、迎接联系人和自愿持续参与串联起来。"></p><a class="button dark" href="index.html#experience"><span data-en="Experience the prototype" data-zh="体验交互原型"></span><span>↗</span></a><div class="project-meta"><div><span data-en="PROJECT TYPE" data-zh="项目性质"></span><strong data-en="Six-person industry collaboration project" data-zh="六人校企合作团队项目"></strong></div><div><span data-en="FOCUS" data-zh="研究方向"></span><strong data-en="B2B2C · Service & business model" data-zh="B2B2C · 服务与商业模式"></strong></div><div><span data-en="STATUS" data-zh="当前状态"></span><strong data-en="Final proposal · not piloted" data-zh="最终方案 · 尚未实地试点"></strong></div></div></section>
<section class="case-section wrap"><div class="case-section-heading"><span class="chapter">01</span><h2 data-en="The problem behind the first visit." data-zh="第一次参与，为什么困难？"></h2></div><div class="case-two"><p class="case-lead" data-en="Paying for an activity does not resolve every barrier to joining it." data-zh="承担活动费用，还不足以解决所有参与障碍。"></p><div class="case-prose"><p data-en="The proposal focuses on adults in Blacktown (Western Sydney, Australia) seeking local connection, initially emphasising ages 35–44. Secondary research points to anxiety, confidence, activity fit and cost as potential barriers. These findings inform a design hypothesis; Blacktown residents’ needs have not yet been tested." data-zh="方案关注希望建立本地联系的 Blacktown（澳大利亚悉尼西部地区）成年人，初步聚焦 35—44 岁人群。二手研究提示焦虑、信心、活动适配和费用可能影响参与。这些研究用于形成设计假设，尚未验证 Blacktown 居民的真实需求。"></p><p data-en="Workers Lifestyle Group (WLG), a Western Sydney hospitality and leisure group, offers membership and visitor-entry options that provide a lower-cost comparison. The proposal therefore asks two questions: what support helps residents join, and when does a gift-card route add value over direct access?" data-zh="WLG（Workers Lifestyle Group，悉尼西部的餐饮与休闲集团）已有会员及访客入场方式，构成较低成本的比较方案。因此，项目需要同时回答：什么支持能帮助居民加入？礼品卡在什么情况下比直接参与创造更多价值？"></p></div></div></section>
<section class="case-band"><div class="wrap"><div class="case-section-heading"><span class="chapter">02</span><h2 data-en="From research to a final proposal." data-zh="从研究，走向最终方案。"></h2></div><div class="method-grid"><article><span>Discover</span><h3 data-en="Understand the context" data-zh="理解问题背景"></h3><p data-en="Review loneliness evidence, community programmes and stakeholder roles." data-zh="梳理孤独感研究、社区项目与利益相关方职责。"></p></article><article><span>Define</span><h3 data-en="Focus the problem" data-zh="聚焦参与问题"></h3><p data-en="Prioritise repeated local interaction and barriers to the first visit." data-zh="聚焦重复本地互动，以及第一次参与的障碍。"></p></article><article><span>Develop</span><h3 data-en="Compare and refine" data-zh="比较与迭代"></h3><p data-en="Compare three concepts; refine Shared Local Mission into Together Pass through storyboards and feedback." data-zh="比较三个候选概念，通过故事板与项目反馈，将 Shared Local Mission 迭代为 Together Pass。"></p></article><article><span>Deliver</span><h3 data-en="Plan validation" data-zh="规划验证方式"></h3><p data-en="Develop service models, cost scenarios, a staged pilot plan and risk controls. Delivery remains proposed." data-zh="形成服务模型、成本情景、分阶段试点计划与风险控制，交付仍处于拟议阶段。"></p></article></div><p class="method-source" data-en="Team approach: Double Diamond, informed by the Design Council. No participant interviews, surveys or live pilot have been completed." data-zh="团队采用 Design Council 的 Double Diamond 框架；尚未开展参与者访谈、问卷或真实试点。"></p></div></section>
<section class="case-section wrap"><div class="case-section-heading"><span class="chapter">03</span><h2 data-en="The final service proposition." data-zh="最终方案，支持怎样的参与？"></h2></div><div class="evolution"><div><span data-en="EARLIER DIRECTION" data-zh="早期方向"></span><h3 data-en="Post-attendance eGift rewards" data-zh="参与活动后提供 eGift 奖励"></h3><p data-en="An early concept focused on rewarding participation and prompting reconnection." data-zh="早期概念侧重用活动后的奖励促进参与及再次联系。"></p></div><span class="evolution-arrow">→</span><div><span data-en="FINAL PROPOSAL" data-zh="最终方案"></span><h3 data-en="Upfront institution-funded support" data-zh="机构提前资助，配套参与支持"></h3><p data-en="An authorised institution funds suitable access. Referrals, registration assistance, named hosts and optional follow-up support participation." data-zh="经授权机构资助适合的参与方式，通过转介、报名协助、明确迎接人与自愿随访提供支持。"></p></div></div><div class="service-chain"><div><b>01</b><h3 data-en="Approve the route" data-zh="先确定资助路径"></h3><p data-en="Buyer and coordinator compare membership, direct payment and cards before enrolment." data-zh="招募前，由买方与协调员比较会员、直接付费和礼品卡路径。"></p></div><div><b>02</b><h3 data-en="Support the first visit" data-zh="支持第一次参与"></h3><p data-en="Residents receive activity information and help with registration. WLG confirms bookings and hosts arrivals." data-zh="提供活动信息和报名协助，由 WLG 确认预约并安排到场迎接。"></p></div><div><b>03</b><h3 data-en="Keep continuation optional" data-zh="自愿选择持续参与"></h3><p data-en="Explain recurring sessions, future costs and free alternatives before support ends." data-zh="支持结束前，说明固定场次、后续费用和免费替代活动。"></p></div></div><p class="case-note" data-en="All partners are proposed. Relationships Australia NSW (RANSW) is the proposed buyer/coordinator and Workers Lifestyle Group (WLG) the proposed activity provider. On the card route, Prezzee delivers a tested product; card, payment and attendance records stay separate. The pilot assumes no new social-matching app or attendance API." data-zh="所有合作均为拟议：Relationships Australia NSW（RANSW）是拟议买方及协调方，Workers Lifestyle Group（WLG）是拟议活动提供方。卡片路径由 Prezzee 发放通过测试的产品；卡片、支付和到场记录分别管理。试点不假设开发新的社交匹配 App 或到场 API。"></p></section>
<section class="case-band"><div class="wrap"><div class="case-section-heading"><span class="chapter">04</span><h2 data-en="A pilot with explicit assumptions." data-zh="把假设，放进可核对的测算。"></h2></div><div class="fact-grid"><article><b>30</b><span data-en="Maximum invited residents" data-zh="最多邀请居民数"></span></article><article><b>6 <small data-en="weeks" data-zh="周"></small></b><span data-en="Pilot, after preparation" data-zh="准备完成后的试点周期"></span></article><article><b>A$900</b><span data-en="Card principal allowance" data-zh="卡片本金规划额度"></span></article><article><b>A$6,660</b><span data-en="Buyer cash ceiling · unapproved" data-zh="买方现金预算上限 · 未获批"></span></article></div><div class="case-two finance-copy"><div><h3 data-en="Compare the same support." data-zh="在相同支持下比较。"></h3><p data-en="For 30 residents, the project models A$5,440 for membership, A$6,160 for direct visitor entry and A$6,660 for cards. Cards must justify a premium of A$500 over visitor entry or A$1,220 over minimum membership." data-zh="30 人情景下，项目测算会员路径 A$5,440、直接入场 A$6,160、卡片路径 A$6,660。卡片需要证明其价值足以覆盖相较直接入场多出的 A$500，或相较最低会员费多出的 A$1,220。"></p><a class="text-link" href="index.html#economics" data-en="Explore the cost comparison ›" data-zh="交互比较三种路径 ›"></a></div><div><h3 data-en="Separate budget from revenue." data-zh="区分预算、本金与收入。"></h3><p data-en="The cash ceiling includes A$900 principal, an A$500 card-service provision and A$600 contingency. A separate A$1,500 Prezzee internal validation resource is unapproved and outside buyer cash. No fee is confirmed as retained profit. Residents unable to use an app need assisted or direct-access alternatives." data-zh="现金上限包含 A$900 本金、A$500 暂列卡片服务费用及 A$600 预备金。另列 A$1,500 Prezzee 内部验证资源，尚待批准，不计入买方现金预算。任何费用均未确认为平台可留存利润。无法使用 App 的居民需提供协助或直接参与等替代路径。"></p></div></div><details class="budget-details"><summary data-en="View the pilot cash-budget breakdown" data-zh="查看试点现金预算明细"></summary><div class="table-scroll"><table><caption data-en="Pilot cash budget · team planning estimates, AUD" data-zh="试点现金预算 · 团队规划估算，单位：澳元"></caption><thead><tr><th data-en="Budget item" data-zh="预算项目"></th><th data-en="Allowance" data-zh="规划额度"></th></tr></thead><tbody><tr><td data-en="Additional welcome support" data-zh="额外迎接支持"></td><td>A$1,620</td></tr><tr><td data-en="Coordination" data-zh="协调工作"></td><td>A$1,650</td></tr><tr><td data-en="Card principal" data-zh="礼品卡本金"></td><td>A$900</td></tr><tr><td data-en="Temporary space" data-zh="临时场地"></td><td>A$240</td></tr><tr><td data-en="Materials" data-zh="物料"></td><td>A$150</td></tr><tr><td data-en="Evaluation" data-zh="评估"></td><td>A$600</td></tr><tr><td data-en="Gifting services · provisional" data-zh="礼品卡服务 · 暂列"></td><td>A$500</td></tr><tr><td data-en="Publicity" data-zh="宣传"></td><td>A$200</td></tr><tr><td data-en="Participation assistance" data-zh="参与协助"></td><td>A$200</td></tr><tr><td data-en="Contingency" data-zh="预备金"></td><td>A$600</td></tr></tbody><tfoot><tr><th data-en="Total buyer cash ceiling" data-zh="买方现金预算上限"></th><th>A$6,660</th></tr></tfoot></table></div><p data-en="Not an approved budget or supplier quotation. Confirm funding, rates, applicable taxes and cost ownership before launch." data-zh="这不是获批预算或供应商报价。启动前需确认资金、单价、适用税费及各项成本承担方。"></p></details></div></section>
<section class="case-section wrap"><div class="case-section-heading"><span class="chapter">05</span><h2 data-en="What would count as progress?" data-zh="如何判断，值得继续？"></h2></div><div class="case-two"><div class="case-prose"><h3 data-en="Observe participation, then assess continuity." data-zh="先观察参与，再判断持续性。"></h3><p data-en="The proposed pilot targets are that at least 18 of 30 invitees attend once, at least half of first attendees return during the pilot, and at least half attend again four to six weeks after support ends. These are management targets to agree before recruitment, not validated efficacy thresholds. Nonresponse is reported separately." data-zh="拟议的试点评估目标为：30 名受邀者中至少 18 人首次到场；首次到场者中至少一半在试点期间再次参与；至少一半在支持结束四至六周后再次到场。这些是招募前需约定的管理目标，并非经过验证的有效性阈值；随访未回应者须单独报告。"></p><p data-en="Buyer retention means a new approved, funded purchase. It is different from resident retention. A small uncontrolled pilot cannot prove that Together Pass reduces loneliness." data-zh="机构留存以新的、获批且有资金支持的采购为依据，与居民持续参与分别衡量。小规模、无对照试点不能证明 Together Pass 导致孤独感降低。"></p></div><div class="growth-card"><span data-en="CONDITIONAL 24-MONTH SCENARIO" data-zh="24 个月条件性情景"></span><strong data-en="8 cohorts. Up to 240 places." data-zh="8 个批次，最多 240 个名额。"></strong><p data-en="A$7,200 cumulative card principal. Places are enrolment opportunities, not unique residents or actual visits. Months 1–6 are preparation; the pilot and possible repeat begin within Months 7–12." data-zh="累计卡片本金 A$7,200。名额代表报名机会，不等于独立居民数或实际到场次数。第 1—6 月为准备期；第 7—12 月安排试点及可能的续购。"></p><p data-en="The reference case remains one pilot. Expansion requires new funded orders, acceptable contribution and delivery capacity; no expansion orders are committed." data-zh="基准情景仍仅为一次试点。扩展需新的有资金订单、可接受的贡献收益及交付能力，尚无已承诺扩展订单。"></p></div></div></section>
<section class="case-band"><div class="wrap"><div class="case-section-heading"><span class="chapter">06</span><h2 data-en="My role in the team." data-zh="我在团队中的贡献。"></h2></div><div class="case-two"><div><p class="case-lead" data-en="Shijie Wu<br>Business model & feasibility analysis" data-zh="吴世杰 Shijie Wu<br>商业模式与可行性分析"></p><p class="case-note" data-en="Our six-person team jointly developed the research, concept and service proposal. My focus was the business model, financial feasibility and implementation and growth planning." data-zh="本项目由六人团队共同完成研究、概念设计及服务方案。我主要负责商业模式、财务可行性与实施增长规划。"></p></div><div class="contributions"><div class="contribution"><span>01</span><div><h4 data-en="Business model and value creation" data-zh="商业模式与价值创造"></h4><p data-en="Future-state BMC, institutional buyer value, funding flows and stakeholder roles." data-zh="未来态 BMC、机构买方价值、资金流及利益相关方职责。"></p></div></div><div class="contribution"><span>02</span><div><h4 data-en="Refinement and financial feasibility" data-zh="方案迭代与财务可行性"></h4><p data-en="Access-route comparison, budget reconciliation and retained-income sensitivity, with cost alignment by the team." data-zh="参与路径比较、预算核对及可留存收入敏感性分析，并与团队对齐成本。"></p></div></div><div class="contribution"><span>03</span><div><h4 data-en="Recommendation, evaluation and growth" data-zh="实施建议、评估与增长规划"></h4><p data-en="Pilot scope, evaluation gates and funded-order growth scenarios." data-zh="试点范围、评估条件及有资金订单驱动的增长情景。"></p></div></div><div class="contribution"><span>04</span><div><h4 data-en="This portfolio reconstruction" data-zh="本网页的独立重制"></h4><p data-en="An AI-assisted website reconstruction presenting the final team concept and my role, with Chinese-first content and an interactive demonstration." data-zh="通过 AI 辅助重制本作品集网页，用中文优先的内容与交互演示呈现团队最终方案及个人贡献。"></p></div></div></div></div></div></section>
<section class="case-section wrap project-provenance"><div class="eyebrow" data-en="PROJECT STATUS" data-zh="项目性质与当前状态"></div><h2 data-en="A team project. A clear personal contribution." data-zh="团队共同探索，个人贡献清晰呈现。"></h2><p data-en="Together Pass is a University of Sydney industry collaboration team project exploring a community participation proposal for Prezzee. This website presents the team’s final concept and Shijie Wu’s contribution through an independently developed interactive portfolio." data-zh="Together Pass 是悉尼大学校企合作团队项目，围绕 Prezzee 探索社区参与支持方案。本网站通过独立开发的交互展示，介绍团队最终概念及吴世杰的个人贡献。"></p><p data-en="The project has completed research, concept development and feasibility planning. It has not conducted resident primary research or a live commercial pilot. This is an academic proposal, not an official Prezzee product; partnerships, funding and payment arrangements still require validation." data-zh="项目已完成研究、概念设计及可行性规划，尚未开展居民原始研究或真实商业试点。本项目为学术提案，非 Prezzee 官方产品；合作、资金与支付安排仍需验证。"></p><div class="about-end"><a class="button dark" href="index.html#experience"><span data-en="Try the final-concept prototype" data-zh="体验最终方案原型"></span><span>↗</span></a></div></section></main>
